# Netlify configuration — static site, no build step
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pretty URLs: /crossfit -> /crossfit.html
[[redirects]]
  from = "/crossfit"
  to = "/crossfit.html"
  status = 200
[[redirects]]
  from = "/hyrox"
  to = "/hyrox.html"
