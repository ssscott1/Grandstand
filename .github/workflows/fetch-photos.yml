          LIST
          ls -la /tmp/photos
      - name: Resize to web masters
        run: |
          python3 - <<'PY'
          import pathlib
          from PIL import Image, ImageOps
          src = pathlib.Path("/tmp/photos")
          out = pathlib.Path("photos-inbox")
          out.mkdir(exist_ok=True)
          n = 0
          for p in sorted(src.glob("*.jpg")):
              try:
                  im = ImageOps.exif_transpose(Image.open(p))
              except Exception as e:
                  print("BAD", p, e)
                  continue
              im.thumbnail((2200, 2200), Image.LANCZOS)
              dest = out / p.name
              im.convert("RGB").save(dest, "JPEG", quality=88, optimize=True)
              n += 1
              print(dest, im.size)
          print(f"{n} photos resized")
          raise SystemExit(0 if n else 1)
          PY
      - name: Push to photos-inbox branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B claude/photos-inbox
          git add -f photos-inbox
          git commit -m "Add resized gym photos fetched from Google Drive"
          git push -f origin claude/photos-inbox
