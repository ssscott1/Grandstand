# Temporary utility workflow: fetches the gym photo shoot JPGs from the
# link-shared Google Drive folder (individually by file ID, skipping the
# huge PSDs), resizes them to web-friendly masters, and pushes them to
# the claude/photos-inbox branch so the sandboxed session can pull them.
name: Fetch gym photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download photos by file ID
        run: |
          pip install --quiet gdown pillow
          mkdir -p /tmp/photos
          while read -r id name; do
            echo "== $name"
            gdown "$id" -O "/tmp/photos/$name" \
              || curl -sSL "https://drive.google.com/uc?export=download&id=$id" -o "/tmp/photos/$name" \
              || echo "FAILED: $name"
          done <<'LIST'
          1MzbDGlP-siTurXVh72M5vFzx9ERhCxCf _DSC2860.jpg
